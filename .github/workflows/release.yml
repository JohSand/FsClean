name: Release

# Push a tag such as v0.2.0 to publish that version. A tag with a suffix (v0.2.0-beta.1) is published
# as a prerelease.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: artifacts

      # Needs a NUGET_API_KEY repository secret: an API key from nuget.org that may push FsClean.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "$NUGET_API_KEY"
          --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
          ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
